services:
  # ===========================================
  # Client (React 19 + Vite)
  # ===========================================
  client:
    build:
      context: .
      dockerfile: services/client/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./services/client:/app
      - ./shared:/app/public/shared
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    env_file:
      - .env
    depends_on:
      - server

  # ===========================================
  # Server (FastAPI + Python)
  # ===========================================
  server:
    build:
      context: .
      dockerfile: services/server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/server:/app
      - ./shared:/app/shared
    environment:
      - SHARED_DIR=/app/shared
    env_file:
      - .env
