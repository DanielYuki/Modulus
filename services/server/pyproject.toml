[project]
name = "modulus-server"
version = "0.1.0"
description = "LaTeX Content Generation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Select minimal but impactful rule sets
select = [
    "E",      # pycodestyle errors (similar to ESLint errors)
    "F",      # Pyflakes (unused imports, variables, including F822 for undefined __all__ exports)
    "I",      # isort (import sorting, like your organizeImports)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bugs)
    "RUF022", # unsorted-dunder-all (ensures __all__ entries are sorted)
    "RUF100", # unused-noqa (validates noqa directives)
]

# Ignore specific rules for flexibility (inspired by client biome config)
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults (common in FastAPI)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
# Use Ruff's formatter (Black-compatible)
quote-style = "double"
indent-style = "space"
line-ending = "auto"
